name: chan_sccp2 distro compatibility

on:
  workflow_run:
    workflows:
      - chan_sccp2 ABI matrix
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  packaged-asterisk:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 26.04
            architecture: x86_64
            runner: ubuntu-26.04
            image: ubuntu:26.04
            package_family: deb
          - distro: Debian testing
            architecture: x86_64
            runner: ubuntu-26.04
            image: debian:testing-slim
            package_family: deb
          - distro: Fedora 45
            architecture: x86_64
            runner: ubuntu-26.04
            image: fedora:45
            package_family: rpm
          - distro: Ubuntu 26.04
            architecture: aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:26.04
            package_family: deb
          - distro: Fedora 45
            architecture: aarch64
            runner: ubuntu-24.04-arm
            image: fedora:45
            package_family: rpm

    name: ${{ matrix.distro }} ${{ matrix.architecture }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve module version
        id: module
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "asterisk-module") | .version')
          printf 'artifact=chan_sccp2-asterisk-linux-${{ matrix.architecture }}-v%s\n' \
            "$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.module.outputs.artifact }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load release artifact with packaged Asterisk
        env:
          ARTIFACT: ${{ steps.module.outputs.artifact }}.so
          DISTRO_IMAGE: ${{ matrix.image }}
          PACKAGE_FAMILY: ${{ matrix.package_family }}
        run: >-
          docker run --rm --pull always
          --volume "${GITHUB_WORKSPACE}:/workspace:ro"
          "$DISTRO_IMAGE"
          /workspace/asterisk-module/ci/distro-tests/test-package.sh
          "$PACKAGE_FAMILY" "/workspace/dist/$ARTIFACT"
