name: chan_sccp2 live bridge matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "asterisk-module/ci/Dockerfile"
      - "asterisk-module/ci/live-tests/**"
      - "asterisk-module/ci/test-native-lifecycle.sh"
      - "asterisk-module/ci/test-support/**"
      - "asterisk-module/src/**"
      - "asterisk-module/build.rs"
      - "asterisk-module/Cargo.toml"
      - "sccp-protocol/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/asterisk-live-bridges.yml"
      - "!**/*.md"
      - "!**/LICENSE*"
  pull_request:
    paths:
      - "asterisk-module/ci/Dockerfile"
      - "asterisk-module/ci/live-tests/**"
      - "asterisk-module/ci/test-native-lifecycle.sh"
      - "asterisk-module/ci/test-support/**"
      - "asterisk-module/src/**"
      - "asterisk-module/build.rs"
      - "asterisk-module/Cargo.toml"
      - "sccp-protocol/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/asterisk-live-bridges.yml"
      - "!**/*.md"
      - "!**/LICENSE*"

jobs:
  bridges:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: "22"
            feature: asterisk-22
          - lane: latest
            feature: asterisk-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Resolve Asterisk source ref
        id: asterisk
        run: |
          ref=$(./asterisk-module/ci/resolve-asterisk-ref.sh "${{ matrix.lane }}")
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Build live bridge test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: asterisk-module/ci/Dockerfile
          target: bridge-test-build
          tags: sccp-bridge-test:${{ matrix.lane }}
          build-args: |
            ASTERISK_REF=${{ steps.asterisk.outputs.ref }}
            ASTERISK_FEATURE=${{ matrix.feature }}
          cache-from: type=gha,scope=asterisk-ci-${{ steps.asterisk.outputs.ref }}
          cache-to: type=gha,mode=max,scope=asterisk-ci-${{ steps.asterisk.outputs.ref }}
          pull: true
          push: false
          load: true

      - name: Exercise live channel and bridge ownership
        run: |
          mkdir -p "$RUNNER_TEMP/bridge-diagnostics"
          docker run --rm \
            -v "$RUNNER_TEMP/bridge-diagnostics:/diagnostics" \
            -e SCCP_LIFECYCLE_ARTIFACT_DIR=/diagnostics \
            sccp-bridge-test:${{ matrix.lane }}

      - name: Preserve lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-lifecycle-${{ matrix.lane }}
          path: ${{ runner.temp }}/bridge-diagnostics/
          if-no-files-found: warn
