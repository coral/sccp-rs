name: chan_sccp2 ABI matrix

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
    paths:
      - "asterisk-module/**"
      - "sccp-protocol/**"
      - "tools/chan-sccp2-config-checker/**"
      - "docs/sccp-example-config.conf"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitmodules"
      - ".github/workflows/asterisk-module.yml"
      - ".github/workflows/asterisk-distro-compatibility.yml"
      - "!**/*.md"
      - "!**/LICENSE*"
  pull_request:
    paths:
      - "asterisk-module/**"
      - "sccp-protocol/**"
      - "tools/chan-sccp2-config-checker/**"
      - "docs/sccp-example-config.conf"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitmodules"
      - ".github/workflows/asterisk-module.yml"
      - ".github/workflows/asterisk-distro-compatibility.yml"
      - "!**/*.md"
      - "!**/LICENSE*"

jobs:
  realtime:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Test isolated Asterisk readiness helper
        run: ./asterisk-module/ci/test-support/test-asterisk-sandbox.sh

      - name: Test SQLite, PostgreSQL, and MySQL realtime migrations
        run: ./asterisk-module/ci/realtime/test-backends.sh

      - uses: docker/setup-buildx-action@v3

      - name: Exercise live realtime provider refreshes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: asterisk-module/ci/Dockerfile
          target: realtime-test
          cache-from: type=gha,scope=asterisk-ci-22.7.0
          cache-to: type=gha,mode=max,scope=asterisk-ci-22.7.0
          pull: true
          push: false

      - name: Exercise live Sorcery configuration through ARI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: asterisk-module/ci/Dockerfile
          target: sorcery-ari-test
          cache-from: type=gha,scope=asterisk-ci-22.7.0
          cache-to: type=gha,mode=max,scope=asterisk-ci-22.7.0
          pull: true
          push: false

  config-checker:
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Test configuration checker
        run: cargo test --locked -p chan-sccp2-config-checker

      - name: Validate distributed configurations
        run: |
          cargo run --locked -p chan-sccp2-config-checker -- --canonical \
            asterisk-module/sccp.conf.example
          cargo run --locked -p chan-sccp2-config-checker -- --canonical \
            docs/sccp-example-config.conf

  build:
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - asterisk: 22.7.0
            cache: asterisk22
            feature: asterisk-22
            publish: true
          - asterisk: 23.4.1
            cache: asterisk23
            feature: asterisk-23
            publish: false

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve module version
        id: module
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "asterisk-module") | .version')
          printf 'version=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install Asterisk header prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential libedit-dev libjansson-dev libsqlite3-dev
          libssl-dev libxml2-dev uuid-dev

      - name: Select and configure Asterisk
        working-directory: asterisk-module/asterisk
        run: |
          git fetch --tags origin "refs/tags/${{ matrix.asterisk }}:refs/tags/${{ matrix.asterisk }}"
          git checkout --detach "${{ matrix.asterisk }}"
          ./configure --without-pjproject-bundled --without-jansson-bundled
          make include/asterisk/buildopts.h

      - name: Test Rust state and configuration
        run: cargo test --locked -p asterisk-module --lib

      - name: Test protocol observation hook
        if: matrix.publish
        run: cargo test --locked -p sccp-protocol --lib

      - name: Build exact Asterisk module
        env:
          ASTERISK_SOURCE_DIR: ${{ github.workspace }}/asterisk-module/asterisk
          ASTERISK_BUILD_DIR: ${{ github.workspace }}/asterisk-module/asterisk
          ASTERISK_VERSION: ${{ matrix.asterisk }}
        run: >-
          cargo build --locked --release -p asterisk-module --no-default-features
          --features ${{ matrix.feature }}

      - name: Verify and package ELF module
        run: |
          readelf -h target/release/libchan_sccp2.so > /tmp/chan-sccp2-elf-header
          grep -q 'Machine:.*Advanced Micro Devices X86-64' /tmp/chan-sccp2-elf-header
          readelf -d target/release/libchan_sccp2.so > /tmp/chan-sccp2-elf-dynamic
          grep -q 'SONAME.*chan_sccp2.so' /tmp/chan-sccp2-elf-dynamic
          nm -D --defined-only target/release/libchan_sccp2.so > /tmp/chan-sccp2-exported-symbols
          grep -q ' T __internal_chan_sccp2_self$' /tmp/chan-sccp2-exported-symbols
          if grep -Eq ' [TDB] (rust_sccp_|sccp_ast_)' /tmp/chan-sccp2-exported-symbols; then
            printf 'legacy adapter symbols escaped the private Rust boundary\n' >&2
            exit 1
          fi
          if strings target/release/libchan_sccp2.so | grep -F 'sccp.dbg.coral.works' >/dev/null; then
            printf 'telemetry client escaped into the ordinary artifact\n' >&2
            exit 1
          fi
          cp target/release/libchan_sccp2.so \
            "chan_sccp2-asterisk-linux-x86_64-${{ steps.module.outputs.version }}.so"

      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: chan_sccp2-asterisk-linux-x86_64-${{ steps.module.outputs.version }}
          path: chan_sccp2-asterisk-linux-x86_64-${{ steps.module.outputs.version }}.so
          if-no-files-found: error
          retention-days: 30

      - name: Build debug telemetry module
        if: matrix.publish
        env:
          ASTERISK_SOURCE_DIR: ${{ github.workspace }}/asterisk-module/asterisk
          ASTERISK_BUILD_DIR: ${{ github.workspace }}/asterisk-module/asterisk
          ASTERISK_VERSION: ${{ matrix.asterisk }}
        run: >-
          cargo build --locked --release -p asterisk-module --no-default-features
          --features ${{ matrix.feature }},telemetry

      - name: Package debug telemetry module
        if: matrix.publish
        run: |
          readelf -h target/release/libchan_sccp2.so > /tmp/chan-sccp2-debug-elf-header
          grep -q 'Machine:.*Advanced Micro Devices X86-64' /tmp/chan-sccp2-debug-elf-header
          readelf -d target/release/libchan_sccp2.so > /tmp/chan-sccp2-debug-elf-dynamic
          grep -q 'SONAME.*chan_sccp2.so' /tmp/chan-sccp2-debug-elf-dynamic
          nm -D --defined-only target/release/libchan_sccp2.so > /tmp/chan-sccp2-debug-exported-symbols
          grep -q ' T __internal_chan_sccp2_self$' /tmp/chan-sccp2-debug-exported-symbols
          if grep -Eq ' [TDB] (rust_sccp_|sccp_ast_)' /tmp/chan-sccp2-debug-exported-symbols; then
            printf 'legacy adapter symbols escaped the private Rust boundary\n' >&2
            exit 1
          fi
          strings target/release/libchan_sccp2.so | grep -F 'sccp.dbg.coral.works' >/dev/null
          cp target/release/libchan_sccp2.so \
            "chan_sccp2-asterisk-debug-linux-x86_64-${{ steps.module.outputs.version }}.so"

      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: chan_sccp2-asterisk-debug-linux-x86_64-${{ steps.module.outputs.version }}
          path: chan_sccp2-asterisk-debug-linux-x86_64-${{ steps.module.outputs.version }}.so
          if-no-files-found: error
          retention-days: 30

  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - asterisk: 22.7.0
            cache: asterisk22
            feature: asterisk-22

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve module version
        id: module
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "asterisk-module") | .version')
          printf 'version=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify ARM64 ELF module
        run: |
          docker buildx build \
            --pull \
            --platform linux/arm64 \
            --progress plain \
            --build-arg "ASTERISK_VERSION=${{ matrix.asterisk }}" \
            --build-arg "ASTERISK_FEATURE=${{ matrix.feature }}" \
            --build-arg "MODULE_VERSION=${{ steps.module.outputs.version }}" \
            --cache-from "type=gha,scope=asterisk-arm64-${{ matrix.cache }}" \
            --cache-to "type=gha,mode=max,scope=asterisk-arm64-${{ matrix.cache }}" \
            --target artifact \
            --output type=local,dest=dist \
            --file asterisk-module/ci/Dockerfile \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: chan_sccp2-asterisk-linux-aarch64-${{ steps.module.outputs.version }}
          path: dist/chan_sccp2-asterisk-linux-aarch64-${{ steps.module.outputs.version }}.so
          if-no-files-found: error
          retention-days: 30

      - name: Build and verify ARM64 debug telemetry module
        run: |
          docker buildx build \
            --pull \
            --platform linux/arm64 \
            --progress plain \
            --build-arg "ASTERISK_VERSION=${{ matrix.asterisk }}" \
            --build-arg "ASTERISK_FEATURE=${{ matrix.feature }},telemetry" \
            --build-arg "ARTIFACT_VARIANT=debug" \
            --build-arg "MODULE_VERSION=${{ steps.module.outputs.version }}" \
            --cache-from "type=gha,scope=asterisk-arm64-${{ matrix.cache }}-debug" \
            --cache-to "type=gha,mode=max,scope=asterisk-arm64-${{ matrix.cache }}-debug" \
            --target artifact \
            --output type=local,dest=dist-debug \
            --file asterisk-module/ci/Dockerfile \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: chan_sccp2-asterisk-debug-linux-aarch64-${{ steps.module.outputs.version }}
          path: dist-debug/chan_sccp2-asterisk-debug-linux-aarch64-${{ steps.module.outputs.version }}.so
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - realtime
      - config-checker
      - build
      - build-arm64
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        run: |
          manifest_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "asterisk-module") | .version')
          expected_tag="v${manifest_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            printf 'release tag %s does not match asterisk-module version %s\n' \
              "$GITHUB_REF_NAME" "$manifest_version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: chan_sccp2-asterisk-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.so > SHA256SUMS

      - name: Publish versioned module release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          release_version="${release_tag#v}"
          assets=(
            "dist/chan_sccp2-asterisk-linux-x86_64-v${release_version}.so"
            "dist/chan_sccp2-asterisk-linux-aarch64-v${release_version}.so"
            "dist/chan_sccp2-asterisk-debug-linux-x86_64-v${release_version}.so"
            "dist/chan_sccp2-asterisk-debug-linux-aarch64-v${release_version}.so"
            dist/SHA256SUMS
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --verify-tag \
              --title "chan_sccp2 v${release_version}" \
              --notes "Precompiled normal and opt-in debug telemetry modules for Linux x86_64 and ARM64/aarch64. Built against Asterisk 22.7.0 and compatibility-tested with Asterisk 22 and 23." \
              --generate-notes \
              --latest
          fi
          existing_assets=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          while IFS= read -r existing_asset; do
            case "$existing_asset" in
              "chan_sccp2-asterisk-linux-x86_64-v${release_version}.so" | \
              "chan_sccp2-asterisk-linux-aarch64-v${release_version}.so" | \
              "chan_sccp2-asterisk-debug-linux-x86_64-v${release_version}.so" | \
              "chan_sccp2-asterisk-debug-linux-aarch64-v${release_version}.so")
                ;;
              chan_sccp2-asterisk-*.so)
                gh release delete-asset "$release_tag" "$existing_asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done <<< "$existing_assets"
          gh release upload "$release_tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
