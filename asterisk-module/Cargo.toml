[package]
name = "asterisk-module"
version = "0.4.19"
edition = "2024"
rust-version = "1.98"
description = "Rust SCCP channel driver for Asterisk 22 and newer"
publish = false
authors.workspace = true
license = "GPL-2.0-or-later"
repository.workspace = true

[package.metadata.release]
allow-branch = ["master"]
publish = false
tag-name = "v{{version}}"
tag-message = "chan_sccp2 v{{version}}"
pre-release-commit-message = "release chan_sccp2 v{{version}}"

[lints]
workspace = true

[lib]
name = "chan_sccp2"
crate-type = ["cdylib", "rlib"]

[features]
# Ordinary workspace builds exercise the Asterisk-independent parts of the
# adapter. A release module must disable this feature and select exactly one
# Asterisk ABI baseline.
default = ["development"]
development = []
asterisk-22 = []
asterisk-23 = []
telemetry = [
    "dep:base64",
    "dep:futures-util",
    "dep:prost",
    "dep:prost-build",
    "dep:protoc-bin-vendored",
    "dep:tokio-tungstenite",
    "dep:uuid",
]
live-asterisk-tests = []

[dependencies]
sccp-protocol = { path = "../sccp-protocol" }
base64 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
form_urlencoded.workspace = true
prost = { workspace = true, optional = true }
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[build-dependencies]
bindgen = "0.72"
prost-build = { workspace = true, optional = true }
protoc-bin-vendored = { workspace = true, optional = true }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
rcgen.workspace = true
syn = { version = "2", features = ["full", "visit"] }
tempfile.workspace = true

[[test]]
name = "asterisk_adapter_architecture"
path = "ci/tests/asterisk_adapter_architecture.rs"

[[test]]
name = "call_completion_contract"
path = "ci/tests/call_completion_contract.rs"

[[test]]
name = "live_bridge_harness_contract"
path = "ci/tests/live_bridge_harness_contract.rs"

[[test]]
name = "native_channel_ownership"
path = "ci/tests/native_channel_ownership.rs"

[[test]]
name = "native_media_ownership"
path = "ci/tests/native_media_ownership.rs"

[[test]]
name = "targeted_reload_contract"
path = "ci/tests/targeted_reload_contract.rs"

[[test]]
name = "sorcery_ari_contract"
path = "ci/tests/sorcery_ari_contract.rs"
